quarkus.datasource.db-kind=mysql
quarkus.datasource.username=quarkus
quarkus.datasource.password=quarkus
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/appdb

quarkus.hibernate-orm.schema-management.strategy=drop-and-create

quarkus.oidc.auth-server-url=http://keycloak:8180/realms/blog
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret!

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

quarkus.smallrye-openapi.info-title=Blog API
quarkus.smallrye-openapi.info-version=0.1
quarkus.smallrye-openapi.info-description=REST interfaces of the DS1 blog project. Blogs are listed \
  with paging and an optional search term, errors share a uniform JSON format.
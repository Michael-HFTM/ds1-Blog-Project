# MySQL aus docker-compose.yml: blog-mysql für den Container ('prod'), blog-mysql-dev für Dev-Modus und Tests
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=dbuser
# Passwort kommt als QUARKUS_DATASOURCE_PASSWORD aus der .env (lokal) bzw. der Umgebung (Container)
# Dev-Modus greift über den Port-Forward von blog-mysql-dev zu, der Container über das Netzwerk blog-nw
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/blogdb
# Tests nutzen dieselbe Compose-MySQL statt Dev Services, da Docker in WSL für Testcontainers nicht erreichbar ist
%test.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/blogdb
%prod.quarkus.datasource.jdbc.url=jdbc:mysql://blog-mysql:3306/blogdb

quarkus.oidc.auth-server-url=http://keycloak:8180/realms/blog
quarkus.oidc.client-id=backend-service
# Client-Secret kommt als QUARKUS_OIDC_CREDENTIALS_SECRET aus der .env (lokal) bzw. der Umgebung (Container)

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

quarkus.smallrye-openapi.info-title=Blog API
quarkus.smallrye-openapi.info-version=0.1
quarkus.smallrye-openapi.info-description=REST interfaces of the DS1 blog project. Blogs are listed \
  with paging and an optional search term, errors share a uniform JSON format.

# Das Schema gehört Flyway (src/main/resources/db/migration), Hibernate rührt es nicht an
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
# Dev-Modus und Tests starten jedes Mal mit leerer DB, im Container bleiben die Daten erhalten
%dev,test.quarkus.flyway.clean-at-start=true

# Swagger UI auch im Produktionsmodus bereitstellen
quarkus.swagger-ui.always-include=true

# Container-Image-Metadaten festlegen
quarkus.container-image.group=Michael-HFTM
quarkus.container-image.name=blog-backend
quarkus.container-image.tag=latest

# Optional: Immer beim Ausführen von './mvnw package' ein Image bauen
quarkus.container-image.build=true
# Optional: Ziel-Registry für späteres Pushen auf GitHub Packages (GHCR)
quarkus.container-image.registry=ghcr.io

# Logging: alles auf stdout, der Container-Runtime überlassen wir das Einsammeln
quarkus.log.level=INFO
# Im Dev-Modus das eigene Paket und die SQL-Statements von Hibernate detailliert ausgeben
%dev.quarkus.log.category."ch.diamondh3art".level=DEBUG
%dev.quarkus.log.category."org.hibernate.SQL".level=DEBUG
# Im Container nur Warnungen und Fehler von Frameworks, die eigenen Geschäftsereignisse aber weiterhin auf INFO
%prod.quarkus.log.level=WARN
%prod.quarkus.log.category."ch.diamondh3art".level=INFO

# Eigene Konfiguration, die Werte hier entsprechen den Defaults im Code
blog.paging.max-size=100
blog.seed-data.enabled=true

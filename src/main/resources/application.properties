# H2 In-Memory; DB_CLOSE_DELAY=-1 hält die DB am Leben, auch wenn der Pool die letzte Verbindung schliesst
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:blogdb;DB_CLOSE_DELAY=-1

quarkus.oidc.auth-server-url=http://keycloak:8180/realms/blog
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret!

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

quarkus.smallrye-openapi.info-title=Blog API
quarkus.smallrye-openapi.info-version=0.1
quarkus.smallrye-openapi.info-description=REST interfaces of the DS1 blog project. Blogs are listed \
  with paging and an optional search term, errors share a uniform JSON format.

# Tabellenschema beim Start automatisch anlegen
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Swagger UI auch im Produktionsmodus bereitstellen
quarkus.swagger-ui.always-include=true

# Container-Image-Metadaten festlegen
quarkus.container-image.group=Michael-HFTM
quarkus.container-image.name=blog-backend
quarkus.container-image.tag=latest

# Optional: Immer beim Ausführen von './mvnw package' ein Image bauen
quarkus.container-image.build=true
# Optional: Ziel-Registry für späteres Pushen auf GitHub Packages (GHCR)
quarkus.container-image.registry=ghcr.io
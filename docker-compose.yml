services:

  # Image zuerst mit './mvnw package' bauen
  blog-backend:
    image: michael-hftm/blog-backend:latest
    container_name: blog-backend
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - blog-nw

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_URL: http://keycloak:8180
    ports:
      - "8180:8180"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./src/blog-realm.json:/opt/keycloak/data/import/blog-realm.json
    # Image hat kein curl, darum Port-Check über bash
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8180"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - blog-nw

networks:
  blog-nw:
    name: blog-nw

volumes:
  keycloak_data:
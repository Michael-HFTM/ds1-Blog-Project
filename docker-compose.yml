services:

  blog-backend:
    image: ghcr.io/michael-hftm/blog-backend:latest
    container_name: blog-backend
    environment:
      QUARKUS_OIDC_CREDENTIALS_SECRET: ${QUARKUS_OIDC_CREDENTIALS_SECRET}
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      blog-mysql:
        condition: service_healthy
    networks:
      - blog-nw

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_URL: http://keycloak:8180
    ports:
      - "8180:8180"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./src/blog-realm.json:/opt/keycloak/data/import/blog-realm.json
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8180"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - blog-nw

  blog-mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD}
      MYSQL_DATABASE: blogdb
    # 3307 statt 3306, damit Dev-Modus und Tests nie aus Versehen auf die 'prod'-Daten zugreifen
    ports:
      - "3307:3306"
    volumes:
      - blog-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - blog-nw

  # Wegwerf-DB für Dev-Modus und Tests, ohne Volume. Startet nur mit '--profile dev'
  blog-mysql-dev:
    image: mysql:8.0
    container_name: blog-mysql-dev
    profiles: [ dev ]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD}
      MYSQL_DATABASE: blogdb
    ports:
      - "3306:3306"

networks:
  blog-nw:
    name: blog-nw

volumes:
  keycloak_data:
  blog-data:
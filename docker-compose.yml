services:

  # Image zuerst mit './mvnw package' bauen
  blog-backend:
    image: ghcr.io/michael-hftm/blog-backend:latest
    container_name: blog-backend
    # Werte stammen aus der .env im Projektordner, die docker-compose automatisch einliest
    environment:
      QUARKUS_OIDC_CREDENTIALS_SECRET: ${QUARKUS_OIDC_CREDENTIALS_SECRET:?in .env setzen}
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD:?in .env setzen}
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      blog-mysql:
        condition: service_healthy
    networks:
      - blog-nw

  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?in .env setzen}
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_URL: http://keycloak:8180
    ports:
      - "8180:8180"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./src/blog-realm.json:/opt/keycloak/data/import/blog-realm.json
    # Image hat kein curl, darum Port-Check über bash
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8180"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - blog-nw

  # Containername dient im Netzwerk blog-nw als Hostname
  blog-mysql:
    image: mysql:8.0
    container_name: blog-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?in .env setzen}
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD:?in .env setzen}
      MYSQL_DATABASE: blogdb
    ports:
      - "3306:3306"
    volumes:
      - blog-data:/var/lib/mysql
    # Über TCP prüfen: der temporäre Server während der Erst-Initialisierung lauscht nur auf dem Socket.
    # ping braucht kein Login, auch "Access denied" heisst: Server läuft
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - blog-nw

networks:
  blog-nw:
    name: blog-nw

volumes:
  keycloak_data:
  # Fester Name statt Projekt-Präfix, damit es dasselbe Volume wie beim 'docker run -v blog-data:...' ist
  blog-data:
    name: blog-data